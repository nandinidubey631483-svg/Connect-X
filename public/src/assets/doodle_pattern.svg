<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.14">
  <!-- Speech Bubble 1 -->
  <g transform="translate(40, 40)">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <line x1="7" y1="8" x2="15" y2="8"/>
    <line x1="7" y1="12" x2="12" y2="12"/>
  </g>

  <!-- Paper Airplane -->
  <g transform="translate(160, 35)">
    <path d="M22 2 11 13"/>
    <path d="m22 2-7 20-4-9-9-4 20-7z"/>
  </g>

  <!-- Smiley Face -->
  <g transform="translate(280, 40)">
    <circle cx="12" cy="12" r="10"/>
    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
    <line x1="9" y1="9" x2="9.01" y2="9"/>
    <line x1="15" y1="9" x2="15.01" y2="9"/>
  </g>

  <!-- Musical Note -->
  <g transform="translate(350, 100)">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="16" r="3"/>
  </g>

  <!-- Coffee Cup -->
  <g transform="translate(45, 150)">
    <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
    <line x1="6" y1="1" x2="6" y2="4"/>
    <line x1="10" y1="1" x2="10" y2="4"/>
    <line x1="14" y1="1" x2="14" y2="4"/>
  </g>

  <!-- Star -->
  <g transform="translate(170, 140)">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
  </g>

  <!-- Double Checkmarks -->
  <g transform="translate(280, 150)">
    <path d="M18 6 6 18l-4-4"/>
    <path d="m22 10-7.5 7.5-2.5-2.5"/>
  </g>

  <!-- Lightning Bolt -->
  <g transform="translate(100, 240)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </g>

  <!-- Heart -->
  <g transform="translate(210, 240)">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </g>

  <!-- Camera -->
  <g transform="translate(320, 230)">
    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
    <circle cx="12" cy="13" r="3"/>
  </g>

  <!-- Rocket -->
  <g transform="translate(40, 330)">
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
