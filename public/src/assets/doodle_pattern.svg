  </g>

  <!-- Speech Bubble 2 (Small) -->
  <g transform="translate(290, 330)">
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
  </g>

  <!-- Tiny dots and stars -->
  <circle cx="110" cy="90" r="1.5" fill="currentColor"/>
  <circle cx="230" cy="80" r="1.5" fill="currentColor"/>
  <circle cx="340" cy="30" r="1.5" fill="currentColor"/>
  <circle cx="120" cy="180" r="1.5" fill="currentColor"/>
  <circle cx="370" cy="190" r="1.5" fill="currentColor"/>
  <circle cx="270" cy="280" r="1.5" fill="currentColor"/>
  <circle cx="90" cy="360" r="1.5" fill="currentColor"/>
  <circle cx="230" cy="360" r="1.5" fill="currentColor"/>
